<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#AA7A1E"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>

    <!-- Rose Gold Accent Gradient -->
    <linearGradient id="roseAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E01E5A"/>
      <stop offset="50%" stop-color="#E8A7A1"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.83
        0 1 0 0 0.68
        0 0 1 0 0.21
        0 0 0 0.7 0" result="goldTint"/>
      <feMerge>
        <feMergeNode in="goldTint"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkle Glow -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Ring -->
  <circle cx="100" cy="100" r="88" stroke="url(#goldMetallic)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="100" cy="100" r="95" stroke="url(#roseAccent)" stroke-width="0.8" opacity="0.25" />

  <!-- Flowing Hair Waves & Woman Profile Silhouette -->
  <!-- Back Hair Waves (Dynamic, Ascending Potential) -->
  <path d="M 55 125 C 40 100, 48 70, 75 52 C 95 38, 125 38, 142 55 C 130 65, 125 80, 138 95 C 150 108, 158 128, 148 152 C 140 170, 115 178, 95 175 C 75 172, 60 155, 55 125 Z" 
        fill="none" stroke="url(#goldMetallic)" stroke-width="3" filter="url(#goldGlow)" />

  <path d="M 68 115 C 60 90, 70 65, 92 50 C 115 35, 140 45, 155 68 C 145 80, 145 98, 160 115 C 172 130, 168 155, 145 168" 
        fill="none" stroke="url(#roseAccent)" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Flowing Main Hair Tendrils -->
  <path d="M 85 45 C 110 32, 140 40, 158 60 C 148 78, 152 100, 168 118 C 180 132, 175 160, 150 172 C 135 180, 110 180, 92 165 C 72 150, 78 120, 90 98 C 98 84, 98 70, 85 45 Z" 
        fill="url(#goldMetallic)" opacity="0.2" />

  <!-- Graceful Woman Profile Line (Nose, Lips, Chin, Neck) -->
  <path d="M 106 72 C 104 78, 106 84, 112 88 C 115 90, 117 92, 115 95 C 112 97, 108 97, 108 99 C 108 102, 114 104, 112 108 C 109 112, 102 116, 102 122 C 102 130, 112 142, 118 155" 
        fill="none" stroke="url(#goldMetallic)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />

  <!-- Crown Wave / Forehead Strand -->
  <path d="M 82 58 C 94 62, 102 66, 106 72" 
        fill="none" stroke="url(#goldMetallic)" stroke-width="3" stroke-linecap="round" />

  <!-- Eyelash & Soft Eye Curve -->
  <path d="M 102 82 C 105 80, 109 82, 111 84" 
        fill="none" stroke="#FFF4D0" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing Starlight Sparks / Potential Awakeners -->
  <!-- Top Right Spark -->
  <g transform="translate(152, 42)" filter="url(#sparkleGlow)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="url(#goldMetallic)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Mid Left Sparkle -->
  <g transform="translate(38, 92)" filter="url(#sparkleGlow)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="url(#roseAccent)"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFF4D0"/>
  </g>

  <!-- Bottom Right Re-entry Sparkle -->
  <g transform="translate(165, 140)" filter="url(#sparkleGlow)">
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="url(#goldMetallic)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Crown Sparkle at Third Eye / Forehead -->
  <g transform="translate(98, 70)" filter="url(#sparkleGlow)">
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4.5" stroke="url(#goldMetallic)" stroke-width="1" opacity="0.8"/>
  </g>
</svg>
